<!-- src/icon.svg — the app mark.
     The same diamond the title bar shows, in the app's accent colour
     (#f0a92e, the `accent` custom property in src/style.css). Kept deliberately
     plain: it has to read at 16px in a browser tab or a tray, and the UI it
     belongs to is flat.
     A dark tile rather than a bare glyph, so the mark does not disappear into a
     dark dock or wash out on a light one.
     This file is the source. src/icon.png is generated from it, and the
     packager (dep/aio/src/build/build-electron.ts) picks that up. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64"
  height="64" role="img" aria-label="llama.master">
  <title>llama.master</title>
  <!-- Tile: the app's own background, with a hairline so the icon still has an
       edge against black. -->
  <rect width="64" height="64" rx="14" fill="#0c0f14" />
  <rect x="0.5" y="0.5" width="63" height="63" rx="13.5" fill="none"
    stroke="#222936" />
  <!-- The mark: a square stood on its corner. 24x24 rotated 45 degrees gives a
       17px half diagonal, which fills the tile without touching the rounding. -->
  <rect x="20" y="20" width="24" height="24" rx="4" transform="rotate(45 32 32)"
    fill="#f0a92e" />
</svg>
